# Mention @claude in an issue or PR comment to delegate work (e.g. "@claude run intent-to-spec on this issue").
# Public repo: only the owner/collaborators can trigger it. Model access via OpenRouter (ADR 0004).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    if: |
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'z-ai/glm-5.3-flash' }}
    steps:
      - name: Skip when no model key is configured
        if: env.OPENROUTER_API_KEY == ''
        run: echo "::notice::OPENROUTER_API_KEY not set; skipping @claude."
      - uses: actions/checkout@v7
        if: env.OPENROUTER_API_KEY != ''
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        if: env.OPENROUTER_API_KEY != ''
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_MODEL: ${{ env.REVIEW_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ env.REVIEW_MODEL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ env.REVIEW_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ env.REVIEW_MODEL }}
        with:
          # The action needs this input to start; requests authenticate via ANTHROPIC_AUTH_TOKEN (OpenRouter docs).
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
