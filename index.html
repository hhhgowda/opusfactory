<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="OpusFactory mobile app" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpusFactory" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>OpusFactory</title>
    <!-- Critical CSS: portrait-only overlay works before JS and even if the bundle fails (ADR 0003). -->
    <style>
      html, body { margin: 0; background: #0f172a; color: #f8fafc; }
      .rotate-overlay { display: none; }
      @media (orientation: landscape) and (hover: none) and (pointer: coarse) {
        #app { visibility: hidden; }
        .rotate-overlay {
          display: flex; position: fixed; inset: 0; z-index: 9999;
          flex-direction: column; align-items: center; justify-content: center; gap: 12px;
          background: #0f172a; color: #f8fafc; text-align: center;
          font: 600 18px/1.4 system-ui, -apple-system, sans-serif;
        }
        .rotate-overlay svg { animation: rotate-hint 1.6s ease-in-out infinite alternate; }
      }
      @keyframes rotate-hint { from { transform: rotate(-90deg); } to { transform: rotate(0deg); } }
      @media (prefers-reduced-motion: reduce) { .rotate-overlay svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="rotate-overlay" role="alert" aria-live="assertive">
      <svg viewBox="0 0 24 24" width="56" height="56" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="7" y="2" width="10" height="20" rx="2" />
        <path d="M11 18h2" />
      </svg>
      <p>Please rotate your device to portrait</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
